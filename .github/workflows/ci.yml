name: CI

# Prüft bei jedem Push und Pull Request automatisch:
# Code-Stil (Lint), Typen (TypeScript) und Tests.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typen prüfen
        run: npm run typecheck

      - name: Tests
        run: npm test -- --ci
